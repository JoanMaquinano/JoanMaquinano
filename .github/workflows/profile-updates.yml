name: Update Profile Dashboard

on:
  schedule:
    # Daily at 9:00 AM Philippine Time (01:00 UTC)
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Dashboard Files
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          REPO_COUNT=$(find . -maxdepth 1 -type f | wc -l)

          cat > now.md << EOF
          # What I'm Working On Now

          Last Updated: ${TODAY}

          ## Role
          Data & ESG Analyst at ISS

          ## Current Focus
          - FTW Data Engineering Fellowship
          - Databricks Data Engineer Associate Preparation
          - Data Engineering Portfolio Development

          ## Active Projects
          - Instacart Medallion Pipeline
          - Chinook Dimensional Model
          - FTW Data Engineering Journal

          ## Current Learning Areas
          - Delta Lake
          - PySpark
          - Dimensional Modeling
          - Data Quality Engineering
          - Data Warehouse Design

          ## Professional Goal
          Transition into a Data Engineering role while continuing to strengthen analytics and data platform expertise.

          ## Portfolio Maintenance
          This file is automatically refreshed to provide a current snapshot of professional focus areas, active projects, and learning objectives.
          EOF

          touch activity-log.md

          if ! grep -q "## ${TODAY}" activity-log.md; then
            {
              echo "## ${TODAY}"
              echo "- Portfolio dashboard refreshed."
              echo "- Active project inventory reviewed."
              echo "- Professional development snapshot recorded."
              echo "- Repository file count: ${REPO_COUNT}"
              echo ""
            } >> activity-log.md
          fi

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add now.md activity-log.md

          git diff --staged --quiet || git commit -m "docs: refresh professional dashboard"

      - name: Push Changes
        run: git push
